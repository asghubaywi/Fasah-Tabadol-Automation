[package]
name = "fasah-engine"
version = "0.1.0"
edition = "2021"
description = "Fasah/Tabadol customs clearance engine — CSV parser + compliance checker"
license = "MIT"

[[bin]]
name = "fasah-engine"
path = "src/main.rs"

[lib]
name = "fasah_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
